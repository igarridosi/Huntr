name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new push cancels the one still going for the old
# commit, so the queue never fills with results nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pipelines/sec-ingest/package-lock.json

      - run: npm ci
      # The SEC ingest pipeline is its own package (postgres, @azure/*); its
      # tests run with the root suite, so its dependencies are installed too.
      - run: npm ci --prefix pipelines/sec-ingest

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck --prefix pipelines/sec-ingest
      - run: npm test

      # Placeholders only. The build has to prove it needs no real keys - every
      # data call is a Server Action or a cron route that runs at request time,
      # not at build time - and this is where that would stop being true.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          SUPABASE_SERVICE_ROLE_KEY: dummy
          NEXT_PUBLIC_SITE_URL: https://example.com
          CRON_SECRET: dummy

  terraform:
    name: terraform · fmt · validate · test (no Azure)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/sec-ingest
    # Mocked providers only: no credentials, nothing reaches Azure. The real
    # plan runs in the SEC ingest deploy workflow, behind an approval.
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - run: terraform test
