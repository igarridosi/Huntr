name: SEC ingest (Azure)

# Deploys infra/sec-ingest with Terraform and publishes the function. Three
# jobs, three GitHub environments, three identities, all through OIDC (no
# secret anywhere):
#
#   plan     productionAzurePlan     no approval   huntr-sec-ingest-plan
#            Reader on the resource group, Storage Blob Data Reader on the
#            tfstate container: it cannot write to Azure or to the state, so
#            it plans with -lock=false.
#   apply    productionAzure         approval      huntr-sec-ingest-deploy
#            Only when the plan has infrastructure changes (and for destroy).
#            Plans again with the lock and applies only if that plan is
#            identical to the one shown; then publishes the code.
#   publish  productionAzurePublish  no approval   huntr-sec-ingest-publish
#            Only when the plan has no changes: code alone. Website
#            Contributor on the function app and nothing else.
#
# All three environments deploy from main only. The binary plan is never
# uploaded: it holds sensitive values in clear, and this repository is
# public. Only the masked plan.txt is kept.

on:
  push:
    branches: [main]
    paths:
      - infra/sec-ingest/**
      - pipelines/sec-ingest/**
      - src/lib/sec/**
      - .github/workflows/sec-ingest-deploy.yml
      # Nothing that reaches neither the package nor the infrastructure.
      - "!**/*.md"
      - "!infra/sec-ingest/tests/**"
      - "!pipelines/sec-ingest/src/__tests__/**"
      - "!src/lib/sec/**/__tests__/**"
      - "!pipelines/sec-ingest/local/**"
      - pipelines/sec-ingest/local/package-azure.mjs
  workflow_dispatch:
    inputs:
      action:
        description: "deploy, or destroy everything Terraform created"
        type: choice
        options: [deploy, destroy]
        default: deploy

# One run at a time; a newer push waits instead of cancelling an apply.
concurrency:
  group: sec-ingest-deploy
  cancel-in-progress: false

permissions:
  id-token: write # OIDC token for Azure
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_STORAGE_USE_AZUREAD: "true"
  TF_IN_AUTOMATION: "true"
  ACTION: ${{ github.event.inputs.action || 'deploy' }}
  RG: rg-huntr-sec-ingest

jobs:
  plan:
    name: terraform plan (${{ github.event.inputs.action || 'deploy' }})
    runs-on: ubuntu-latest
    environment: productionAzurePlan
    timeout-minutes: 15
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_sec_user_agent: ${{ vars.SEC_USER_AGENT }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
    defaults:
      run:
        working-directory: infra/sec-ingest
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      function_app: ${{ steps.app.outputs.function_app }}
      settings: ${{ steps.app.outputs.settings }}
      secret_version: ${{ steps.app.outputs.secret_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: terraform init
        run: >
          terraform init -input=false -lockfile=readonly
          -backend-config="resource_group_name=rg-huntr-sec-ingest"
          -backend-config="storage_account_name=sthuntrtfstate"
          -backend-config="container_name=tfstate"
          -backend-config="key=sec-ingest.tfstate"

      # -lock=false: this identity can read the state but not take its lease.
      # The workflow runs one at a time, and the apply plans again with the
      # lock before it changes anything.
      - name: terraform plan
        id: plan
        run: |
          flag=""; [ "$ACTION" = "destroy" ] && flag="-destroy"
          set +e
          terraform plan -input=false -lock=false -detailed-exitcode $flag -out=tfplan
          code=$?
          set -e
          case "$code" in
            0) echo "changes=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "changes=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::terraform plan failed (exit $code)"; exit "$code" ;;
          esac
          terraform show -no-color tfplan > plan.txt
          {
            echo "## terraform plan ($ACTION)"
            echo '```'
            grep -E '^(  # |Plan:|No changes)' plan.txt || true
            echo '```'
            if [ "$code" = 0 ]; then
              echo "No infrastructure changes: the code is published without approval (job publish)."
            else
              echo "Infrastructure changes: the apply waits for approval in productionAzure."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The function app's body carries the Application Insights connection
      # string, so plan.txt shows the whole body as (sensitive value). This
      # prints the body the plan expects with every setting's value removed,
      # and the setting names it adds and removes against Terraform's state.
      # Settings added outside Terraform are not in the state: the apply and
      # publish jobs compare against the live app. The JSON plan holds
      # secrets in clear: it stays in the runner's temp directory and is
      # deleted before anything is printed.
      - name: Function app after the plan (setting values removed)
        id: app
        if: env.ACTION == 'deploy'
        run: |
          json="$RUNNER_TEMP/plan.json"
          terraform show -json tfplan > "$json"
          sel='[.resource_changes[] | select(.address == "azapi_resource.function_app")][0].change'
          body=$(jq "$sel.after.body | .properties.siteConfig.appSettings |= map(.name)" "$json")
          after=$(jq -r "$sel.after.body.properties.siteConfig.appSettings[].name" "$json" | sort)
          before=$(jq -r "($sel.before.body.properties.siteConfig.appSettings // [])[].name" "$json" | sort)
          # The database URL setting is a Key Vault reference, not the URL:
          # its secret version can be shown, and a rotation shows up here.
          ref='.properties.siteConfig.appSettings // [] | map(select(.name == "SEC_INGEST_DATABASE_URL"))[0].value // "" | (capture("SecretVersion=(?<v>[0-9a-f]+)").v // "none")'
          version_before=$(jq -r "($sel.before.body // {}) | $ref" "$json")
          version_after=$(jq -r "($sel.after.body // {}) | $ref" "$json")
          {
            echo "function_app=$(terraform output -raw function_app_name 2>/dev/null || true)"
            echo "settings=$(echo "$after" | jq -R . | jq -cs .)"
            echo "secret_version=$(jq -r '.variables.database_url_secret_version.value // ""' "$json")"
          } >> "$GITHUB_OUTPUT"
          rm -f "$json"
          {
            echo "### Function app body after the plan (setting values removed)"
            echo '```json'
            echo "$body"
            echo '```'
            echo "### App settings removed, against Terraform's state"
            comm -23 <(echo "$before" | sed '/^$/d') <(echo "$after" | sed '/^$/d') | sed 's/^/- /'
            echo "### App settings added, against Terraform's state"
            comm -13 <(echo "$before" | sed '/^$/d') <(echo "$after" | sed '/^$/d') | sed 's/^/- /'
            echo "### Database URL secret version"
            echo "$version_before -> $version_after"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: plan-text
          path: infra/sec-ingest/plan.txt
          retention-days: 3

  apply:
    name: terraform apply and publish
    needs: plan
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: productionAzure
    timeout-minutes: 30
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_sec_user_agent: ${{ vars.SEC_USER_AGENT }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      FUNCTION_APP: ${{ needs.plan.outputs.function_app }}
      SETTINGS: ${{ needs.plan.outputs.settings }}
      SECRET_VERSION: ${{ needs.plan.outputs.secret_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - uses: actions/download-artifact@v4
        with:
          name: plan-text
          path: approved

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: terraform plan again (only the plan that was shown)
        working-directory: infra/sec-ingest
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="resource_group_name=rg-huntr-sec-ingest" \
            -backend-config="storage_account_name=sthuntrtfstate" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=sec-ingest.tfstate"
          flag=""; [ "$ACTION" = "destroy" ] && flag="-destroy"
          terraform plan -input=false -lock-timeout=5m $flag -out=tfplan
          terraform show -no-color tfplan > plan.txt
          if ! diff -u ../../approved/plan.txt plan.txt; then
            echo "::error::The plan changed since it was shown. Nothing was applied: run the workflow again and review the new plan."
            exit 1
          fi
          # Settings added outside Terraform are only removed when the apply
          # sends the function app's body. If it does not, they would stay:
          # stop before applying anything.
          if [ "$ACTION" = "deploy" ] && [ -n "$FUNCTION_APP" ] && ! grep -q '# azapi_resource.function_app will be' plan.txt; then
            bash scripts/check-app.sh settings "$SETTINGS"
          fi

      - name: terraform apply
        working-directory: infra/sec-ingest
        run: |
          terraform apply -input=false -lock-timeout=5m tfplan
          if [ "$ACTION" = "deploy" ]; then
            echo "FUNCTION_APP=$(terraform output -raw function_app_name)" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        if: env.ACTION == 'deploy'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipelines/sec-ingest/package-lock.json

      - name: Build the deploy package
        if: env.ACTION == 'deploy'
        working-directory: pipelines/sec-ingest
        # No install scripts: the job holds an OIDC token, and the build does
        # not need them (esbuild's binary comes as an optional dependency).
        run: |
          npm ci --ignore-scripts
          npm run package:azure

      - name: Check the function app (storage, Key Vault, settings)
        if: env.ACTION == 'deploy'
        run: |
          bash infra/sec-ingest/scripts/check-app.sh storage
          bash infra/sec-ingest/scripts/check-app.sh keyvault "$SECRET_VERSION"
          bash infra/sec-ingest/scripts/check-app.sh settings "$SETTINGS"

      - name: Publish the function
        if: env.ACTION == 'deploy'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP }}
          package: pipelines/sec-ingest/deploy
          sku: flexconsumption

  publish:
    name: publish the code (no infrastructure changes)
    needs: plan
    if: needs.plan.outputs.changes == 'false' && github.event.inputs.action != 'destroy'
    runs-on: ubuntu-latest
    environment: productionAzurePublish
    timeout-minutes: 20
    env:
      FUNCTION_APP: ${{ needs.plan.outputs.function_app }}
      SETTINGS: ${{ needs.plan.outputs.settings }}
      SECRET_VERSION: ${{ needs.plan.outputs.secret_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipelines/sec-ingest/package-lock.json

      - name: Build the deploy package
        working-directory: pipelines/sec-ingest
        # No install scripts: the job holds an OIDC token, and the build does
        # not need them (esbuild's binary comes as an optional dependency).
        run: |
          npm ci --ignore-scripts
          npm run package:azure

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The same checks the apply makes. This identity could change the
      # app's settings; the last check makes sure nothing did.
      - name: Check the function app (storage, Key Vault, settings)
        run: |
          [ -n "$FUNCTION_APP" ] || { echo "::error::the plan did not report the function app"; exit 1; }
          bash infra/sec-ingest/scripts/check-app.sh storage
          bash infra/sec-ingest/scripts/check-app.sh keyvault "$SECRET_VERSION"
          bash infra/sec-ingest/scripts/check-app.sh settings "$SETTINGS"

      - name: Publish the function
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP }}
          package: pipelines/sec-ingest/deploy
          sku: flexconsumption
