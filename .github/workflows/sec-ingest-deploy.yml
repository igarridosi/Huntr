name: SEC ingest (Azure)

# Deploys infra/sec-ingest with Terraform and publishes the function.
# Two jobs, both in the productionAzure environment, so each waits for an
# approval: first the plan (read-only), then the apply of that same plan.
# The identity is huntr-sec-ingest-deploy through OIDC: no secret anywhere.
#
# The binary plan is never uploaded: it holds sensitive values in clear, and
# this repository is public, so its artifacts are readable by anyone signed
# in to GitHub. Only the masked plan.txt is kept. The apply job plans again
# and applies only if its plan.txt is identical to the approved one.

on:
  push:
    branches: [main]
    paths:
      - infra/sec-ingest/**
      - pipelines/sec-ingest/**
      - src/lib/sec/**
      - .github/workflows/sec-ingest-deploy.yml
  workflow_dispatch:
    inputs:
      action:
        description: "deploy, or destroy everything Terraform created"
        type: choice
        options: [deploy, destroy]
        default: deploy

# One run at a time; a newer push waits instead of cancelling an apply.
concurrency:
  group: sec-ingest-deploy
  cancel-in-progress: false

permissions:
  id-token: write # OIDC token for Azure
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_STORAGE_USE_AZUREAD: "true"
  TF_IN_AUTOMATION: "true"
  TF_VAR_sec_user_agent: ${{ vars.SEC_USER_AGENT }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  ACTION: ${{ github.event.inputs.action || 'deploy' }}
  WORKDIR: infra/sec-ingest

jobs:
  plan:
    name: terraform plan (${{ github.event.inputs.action || 'deploy' }})
    runs-on: ubuntu-latest
    environment: productionAzure
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/sec-ingest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: terraform init
        run: >
          terraform init -input=false -lockfile=readonly
          -backend-config="resource_group_name=rg-huntr-sec-ingest"
          -backend-config="storage_account_name=sthuntrtfstate"
          -backend-config="container_name=tfstate"
          -backend-config="key=sec-ingest.tfstate"

      - name: terraform plan
        run: |
          flag=""; [ "$ACTION" = "destroy" ] && flag="-destroy"
          terraform plan -input=false -lock-timeout=5m $flag -out=tfplan
          terraform show -no-color tfplan > plan.txt
          {
            echo "## terraform plan ($ACTION)"
            echo '```'
            grep -E '^(  # |Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The function app's body carries the Application Insights connection
      # string, so plan.txt shows the whole body as (sensitive value). This
      # prints the body the apply will send with every setting's value
      # removed, and the setting names it adds and removes against the app as
      # it is now. The JSON plan holds secrets in clear: it stays in the
      # runner's temp directory and is deleted before anything is printed.
      - name: Function app after the apply (setting values removed)
        if: env.ACTION == 'deploy'
        run: |
          json="$RUNNER_TEMP/plan.json"
          terraform show -json tfplan > "$json"
          sel='[.resource_changes[] | select(.address == "azapi_resource.function_app")][0].change.after.body'
          body=$(jq "$sel | .properties.siteConfig.appSettings |= map(.name)" "$json")
          after=$(jq -r "$sel | .properties.siteConfig.appSettings[].name" "$json" | sort)
          rm -f "$json"
          app=$(terraform output -raw function_app_name 2>/dev/null || true)
          now=""
          if [ -n "$app" ]; then
            now=$(az functionapp config appsettings list -g rg-huntr-sec-ingest -n "$app" --query "[].name" -o tsv 2>/dev/null | sort || true)
          fi
          {
            echo "### Function app body the apply sends (setting values removed)"
            echo '```json'
            echo "$body"
            echo '```'
            echo "### App settings the apply removes"
            comm -23 <(echo "$now" | sed '/^$/d') <(echo "$after" | sed '/^$/d') | sed 's/^/- /'
            echo "### App settings the apply adds"
            comm -13 <(echo "$now" | sed '/^$/d') <(echo "$after" | sed '/^$/d') | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: plan-text
          path: infra/sec-ingest/plan.txt
          retention-days: 3

  apply:
    name: terraform apply and publish
    needs: plan
    runs-on: ubuntu-latest
    environment: productionAzure
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - uses: actions/download-artifact@v4
        with:
          name: plan-text
          path: approved

      - name: terraform apply (only the plan that was approved)
        working-directory: infra/sec-ingest
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="resource_group_name=rg-huntr-sec-ingest" \
            -backend-config="storage_account_name=sthuntrtfstate" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=sec-ingest.tfstate"
          flag=""; [ "$ACTION" = "destroy" ] && flag="-destroy"
          terraform plan -input=false -lock-timeout=5m $flag -out=tfplan
          terraform show -no-color tfplan > plan.txt
          if ! diff -u ../../approved/plan.txt plan.txt; then
            echo "::error::The plan changed since it was approved. Nothing was applied: run the workflow again and review the new plan."
            exit 1
          fi
          terraform apply -input=false -lock-timeout=5m tfplan
          if [ "$ACTION" = "deploy" ]; then
            echo "FUNCTION_APP=$(terraform output -raw function_app_name)" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        if: env.ACTION == 'deploy'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipelines/sec-ingest/package-lock.json

      - name: Build the deploy package
        if: env.ACTION == 'deploy'
        working-directory: pipelines/sec-ingest
        run: |
          npm ci
          npm run package:azure

      - uses: azure/login@v2
        if: env.ACTION == 'deploy'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The app must reach its storage through the identity only. A plain
      # AzureWebJobsStorage overrides the AzureWebJobsStorage__* settings and
      # makes the host use Shared Key, which the accounts refuse. Names only:
      # no value is ever printed.
      - name: Check the host storage settings
        if: env.ACTION == 'deploy'
        run: |
          names=$(az functionapp config appsettings list -g rg-huntr-sec-ingest -n "$FUNCTION_APP" --query "[].name" -o tsv)
          echo "$names" | sort
          if echo "$names" | grep -qiE '^(AzureWebJobsStorage|DEPLOYMENT_STORAGE_CONNECTION_STRING)$'; then
            echo "::error::a storage connection string is set on $FUNCTION_APP; host storage must use the identity only"
            exit 1
          fi
          for required in AzureWebJobsStorage__accountName AzureWebJobsStorage__credential AzureWebJobsStorage__clientId; do
            echo "$names" | grep -qx "$required" || { echo "::error::$required is missing on $FUNCTION_APP"; exit 1; }
          done

      - name: Publish the function
        if: env.ACTION == 'deploy'
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP }}
          package: pipelines/sec-ingest/deploy
          sku: flexconsumption
